[project]
name = "mail-jira-agent"
version = "0.1.0"
description = "Local Gmail-to-Jira assistant with human-controlled actions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
mail-jira-agent = "mail_jira_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mail_jira_agent"]