name: Maintenance Agent CI

on:
  push:
    paths:
      - "maintlog-intelligence/**"
      - ".github/workflows/maintlog-ci.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "maintlog-intelligence/**"
      - ".github/workflows/maintlog-ci.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintlog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: maintlog-intelligence

    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            maintlog-intelligence/requirements-agent.lock
            maintlog-intelligence/requirements-ci.txt
            maintlog-intelligence/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-agent.lock
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Record environment
        run: |
          python --version
          python -m pip freeze
          python -c "import langgraph; print('LangGraph available')"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Run tests with branch coverage
        run: >
          python -m coverage run -m pytest tests
          -ra
          --junitxml=artifacts/ci/junit.xml

      - name: Generate coverage reports
        if: always()
        run: |
          python -m coverage report
          python -m coverage xml -o artifacts/ci/coverage.xml
          python -m coverage json -o artifacts/ci/coverage.json
          python -m coverage html -d artifacts/ci/htmlcov

      - name: Validate datasets and reproduce baseline
        run: >
          python -m maintlog.evaluation
          --data-root data/public
          --output-dir artifacts/ci-evaluation

      - name: Run complete-agent replay comparison
        run: >
          maintlog-compare data/demo/comparison_cases.json
          --backend replay
          --trials 3
          --output artifacts/ci-comparison.json

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload test and evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintlog-reports-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            maintlog-intelligence/artifacts/ci/
            maintlog-intelligence/artifacts/ci-evaluation/
            maintlog-intelligence/artifacts/ci-comparison.json

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: maintlog-distributions-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: maintlog-intelligence/dist/