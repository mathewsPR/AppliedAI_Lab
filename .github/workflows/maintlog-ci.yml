name: Maintenance Agent CI

on:
  push:
    paths:
      - "maintlog-intelligence/**"
      - ".github/workflows/maintlog-ci.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "maintlog-intelligence/**"
      - ".github/workflows/maintlog-ci.yml"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: maintlog-intelligence

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            maintlog-intelligence/requirements-agent.lock
            maintlog-intelligence/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-agent.lock
          python -m pip install ruff==0.16.9
          python -m pip check

      - name: Verify agent dependency
        run: python -c "import langgraph; print('LangGraph available')"

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate datasets and reproduce baseline
        run: python -m maintlog.evaluation --data-root data/public --output-dir artifacts/ci-evaluation

      - name: Run replay comparison
        run: maintlog-compare data/demo/comparison_cases.json --backend replay --trials 3 --output artifacts/ci-comparison.json
